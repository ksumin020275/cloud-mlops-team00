name: bike-rental              # 프로젝트 이름 (폴더 이름이 한글이라 직접 지정)

services:
  bike-app:
    build: .
    image: bike-rental-app:latest
    container_name: bike-rental-app
    ports:
      - "8501:8501"            # 내 컴퓨터 8501 → 컨테이너 8501
    environment:
      # CloudWatch 로그 전송용 (선택). 실행하는 터미널에 설정돼 있으면 그대로 전달되고,
      # 없으면 앱은 로그를 콘솔에만 남기고 정상 동작한다. 키를 이 파일에 직접 쓰지 말 것.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_DEFAULT_REGION=ap-northeast-2
    restart: unless-stopped     # 컨테이너가 죽으면 자동 재시작
