팀명 :000

예측하려는 시점 : 매일 자정(00:00) 기준, 다음 날 24시간(0시~23시) 동안의 시간대별 대여량 예측

입력과 단위 : 시간(Hour),정수형
            기온(temp),실수형
            습도(humidity),정수형
            풍속(wind),실수형
            강수량(rain_),실수형
            계절(season),4개의 계절 각각에 대한 해당 여부(원-핫 인코딩 적용),이진형(1=해당,0은 비해당)
            휴일 여부(이진형) 휴일 = 1, 평일 = 0으로 표시
            주말 여부(Weekend), 날짜로 자동 판단, 이진형(1=토·일, 0=평일)

예상 결과와 :특정 시간이나 조건에 대여하는 시간당 자전거 총 대여량

단위 : 대(count),정수형

실제 정답을 얻는 방법 :peak_hour(피크타임 판별) -> 자전거 수요가 급증하는 08~09시,18~21시 같은 출퇴근 시간을 고릅니다. 대여한다면 1(O), 대여하지 않는다면 0(X)

                    discomfort(불쾌지수) -> 1.8 * temp - 0.55 * (1 - humidity/100) * (1.8 * temp - 26) + 32
                    날씨와 자전거 대여량 사이의 복잡한 패턴을 정확히 파악하기 위해, 스스로 오차를 수정하며 정답에 가까워지는 고성능 학습 알고리즘인 XGBoost를 사용

                    precip_yn(강수량) -> 1 if rain > 0 else 0
                    비가 온다면 1, 비가 오지 않는 다면 0

                    holiday(휴일) -> holiday = 1 if holiday_input == '휴일' else 0 -글자로 된 '휴일/평일' 데이터를 인공지능이 계산할 수 있도록 스위치 형태의 숫자(1과 0)로 바꿔주는 코드
                    휴일을 선택하면 1, 그렇지 않으면 0



단순 비교 기준 :과거 동일 계절, 동일 시간대의 '평균 자전거 대여량'

평가 자료를 나누는 방법 :시간의 흐름에 따라 과거 데이터(Train)로 학습한 뒤 가장 최근의 데이터로 예측 성능 평가

함수·HTTP(웹 요청·응답 통신 규약)·배치 중 필요한 방식과 이유 :함수(Function)방식 사용, 사용자가 날씨 조건을 입력하는 즉시 결과 반환해야 하므로 
                                                                              일괄 처리인 배치보단 모델을 메모리에 올려 실시간으로 즉각
                                                                              반응하는 함수 사용

아직 확인하지 못한 것 : 비즈니스 활용 방안,기대 효과,평가 지표,한계점 및 향후 개선 방향

평가 지표 : MAE(평균 절대 오차), R2(결정계수)
평가 결과 : 단순 비교 기준 MAE 344.0대 / XGBoost 모델 MAE 239.7대, R2 0.728 (기준 대비 오차 30.3% 감소)
한계점 : 데이터가 1년치뿐이라 평가 기간(가을)의 학습 데이터가 열흘뿐, 하루 동안 날씨가 같다고 가정
향후 개선 방향 : 여러 해 데이터 확보, 시간대별 날씨 예보 반영


